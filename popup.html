<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video Counter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1 data-i18n="extName"></h1>
      <span id="date" class="muted"></span>
    </header>

    <section class="today">
      <p id="headline" class="headline"></p>
      <div id="rows"></div>
    </section>

    <section class="week">
      <div class="week-head">
        <h2 data-i18n="last7days"></h2>
        <span id="worst" class="muted"></span>
      </div>
      <div id="chart" class="chart" role="img"></div>
    </section>

    <footer>
      <span class="muted" data-i18n="privacyNote"></span>
      <button id="clear" type="button" data-i18n="clearData"></button>
    </footer>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
